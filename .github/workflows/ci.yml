name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release-proof:
        description: Validate release package proofs without publishing
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      full:
        description: Run every compatibility, database and security check
        required: false
        default: false
        type: boolean
      release-proof:
        description: Require Plugin Check, memory and packaged admin proof
        required: false
        default: false
        type: boolean
    outputs:
      artifact-name:
        description: Exact package artifact produced by the quality gate
        value: ${{ jobs.quality.outputs.artifact-name }}
      sha256:
        description: SHA256 of the exact package artifact
        value: ${{ jobs.quality.outputs.sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.event_name != 'workflow_call' }}

jobs:
  quality:
    name: Quality, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      claims: ${{ steps.scope.outputs.claims }}
      oauth: ${{ steps.scope.outputs.oauth }}
      wordpress: ${{ steps.scope.outputs.wordpress }}
      security: ${{ steps.scope.outputs.security }}
      codeql: ${{ steps.scope.outputs.codeql }}
      artifact-name: aculect-ai-companion-package-${{ github.sha }}-${{ github.run_attempt }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Classify complete event diff
        id: scope
        env:
          CI_FULL: ${{ inputs.full || inputs.release-proof }}
        run: node bin/ci-changes.mjs

      - name: Setup PHP
        if: steps.scope.outputs.quality == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        if: steps.scope.outputs.quality == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php82-

      - name: Install locked development dependencies
        if: steps.scope.outputs.quality == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Enforce modularity ratchet for pull requests
        if: steps.scope.outputs.quality == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php bin/check-modularity.php --config=.codex/modularity-rules.php --changed-from="origin/${BASE_REF}"

      - name: Require PHPStan baseline justification when baseline changes
        if: steps.scope.outputs.quality == 'true' && github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --name-only "origin/${BASE_REF}"...HEAD | grep -qx 'phpstan-baseline.neon'; then
            exit 0
          fi

          if ! printf '%s\n' "$PR_BODY" | grep -Eq '^[[:space:]-]*PHPStan baseline justification:\s+\S+'; then
            echo "::error::phpstan-baseline.neon changed. Add a non-empty 'PHPStan baseline justification:' line to the PR body before merging."
            exit 1
          fi

      - name: Install locked JavaScript dependencies
        if: steps.scope.outputs.quality == 'true'
        run: npm ci

      - name: Run essential quality checks and build once
        if: steps.scope.outputs.quality == 'true'
        run: npm run check:ci

      - name: Scan repository secrets
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.176.0
          semgrep scan --config p/secrets --exclude vendor --exclude node_modules
          --exclude release --metrics=off --error .

      - name: Install production Composer dependencies
        if: steps.scope.outputs.quality == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Package and verify the canonical production archive
        if: steps.scope.outputs.quality == 'true'
        run: bash bin/ci-package.sh

      - name: Record immutable package checksum
        if: steps.scope.outputs.quality == 'true'
        id: digest
        run: echo "sha256=$(cut -d ' ' -f 1 release/aculect-ai-companion.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload canonical package
        if: steps.scope.outputs.quality == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aculect-ai-companion-package-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/aculect-ai-companion.zip
            release/aculect-ai-companion.zip.sha256
          if-no-files-found: error
          retention-days: 3

  database:
    name: Real database proofs
    needs: quality
    if: needs.quality.outputs.claims == 'true' || needs.quality.outputs.oauth == 'true'
    uses: ./.github/workflows/database-proof.yml
    with:
      claims: ${{ needs.quality.outputs.claims == 'true' }}
      oauth: ${{ needs.quality.outputs.oauth == 'true' }}

  compatibility:
    name: PHP and WordPress compatibility
    needs: quality
    if: needs.quality.outputs.quality == 'true' || needs.quality.outputs.wordpress == 'true'
    uses: ./.github/workflows/compatibility.yml
    with:
      php: ${{ needs.quality.outputs.quality == 'true' }}
      wordpress: ${{ needs.quality.outputs.wordpress == 'true' }}

  security:
    name: PHP and JavaScript security
    needs: quality
    if: needs.quality.outputs.security == 'true' || needs.quality.outputs.codeql == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      php: ${{ needs.quality.outputs.security == 'true' }}
      codeql: ${{ needs.quality.outputs.codeql == 'true' }}

  package-proof:
    name: Exact package proofs
    needs: quality
    if: needs.quality.outputs.quality == 'true'
    uses: ./.github/workflows/package-proof.yml
    with:
      package-sha256: ${{ needs.quality.outputs.sha256 }}
      package-artifact-name: ${{ needs.quality.outputs.artifact-name }}
      release-proof: ${{ inputs.release-proof || false }}

  required:
    name: Required CI
    if: always()
    needs: [quality, database, compatibility, security, package-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require every applicable proof to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node bin/ci-required.mjs
