name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select applicable checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      php: ${{ steps.scope.outputs.php }}
      assets: ${{ steps.scope.outputs.assets }}
      package: ${{ steps.scope.outputs.package }}
      claims: ${{ steps.scope.outputs.claims }}
      oauth: ${{ steps.scope.outputs.oauth }}
      wordpress: ${{ steps.scope.outputs.wordpress }}
      browser: ${{ steps.scope.outputs.browser }}
      security: ${{ steps.scope.outputs.security }}
      codeql: ${{ steps.scope.outputs.codeql }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Classify complete event diff
        id: scope
        run: node bin/ci-changes.mjs

  php:
    name: PHP Quality
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Enforce modularity ratchet for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php bin/check-modularity.php --config=.codex/modularity-rules.php --changed-from="origin/${BASE_REF}"

      - name: Enforce modularity ratchet for direct pushes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "$BEFORE_SHA^{commit}"
            php bin/check-modularity.php --config=.codex/modularity-rules.php --changed-from="$BEFORE_SHA"
          fi

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php82-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Require PHPStan baseline justification when baseline changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --name-only "origin/${BASE_REF}"...HEAD | grep -qx 'phpstan-baseline.neon'; then
            exit 0
          fi

          if ! printf '%s\n' "$PR_BODY" | grep -Eq '^[[:space:]-]*PHPStan baseline justification:\s+\S+'; then
            echo "::error::phpstan-baseline.neon changed. Add a non-empty 'PHPStan baseline justification:' line to the PR body before merging."
            exit 1
          fi

      - name: Run PHP CI checks and tests
        run: composer ci:php

  assets:
    name: Assets
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: aculect-assets-${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js -- --quiet

      - name: Lint styles
        run: npm run lint:css

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build assets
        run: npm run build

      - name: Upload canonical built assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aculect-assets-${{ github.sha }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Canonical production package
    needs: [changes, assets]
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/package.yml
    with:
      assets-built: true
      assets-artifact-name: ${{ needs.assets.outputs.artifact-name }}

  database:
    name: Real database proofs
    needs: changes
    if: needs.changes.outputs.claims == 'true' || needs.changes.outputs.oauth == 'true'
    uses: ./.github/workflows/database-proof.yml
    with:
      claims: ${{ needs.changes.outputs.claims == 'true' }}
      oauth: ${{ needs.changes.outputs.oauth == 'true' }}

  wordpress:
    name: Native WordPress contract
    needs: changes
    if: needs.changes.outputs.wordpress == 'true'
    uses: ./.github/workflows/wordpress-abilities.yml

  browser:
    name: Packaged WordPress and browser proof
    needs: [changes, package]
    if: needs.changes.outputs.browser == 'true'
    uses: ./.github/workflows/workflow-proof.yml
    with:
      package-sha256: ${{ needs.package.outputs.sha256 }}
      package-artifact-name: ${{ needs.package.outputs.artifact-name }}

  security:
    name: PHP and secrets security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/php-security.yml

  codeql:
    name: JavaScript security
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  required:
    name: Required CI
    if: always()
    needs: [changes, php, assets, package, database, wordpress, browser, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require every applicable proof to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node bin/ci-required.mjs
