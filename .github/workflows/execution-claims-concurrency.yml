name: Execution Claims Concurrency

# Manual focused proof. Automatic coverage is selected by CI on every PR base and release push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claims-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    uses: ./.github/workflows/database-proof.yml
    with:
      claims: true
