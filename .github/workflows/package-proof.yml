name: Packaged Plugin Proofs

on:
  workflow_call:
    inputs:
      package-artifact-name:
        type: string
        required: true
      package-sha256:
        type: string
        required: true
      release-proof:
        description: Also require Plugin Check, memory and packaged admin proof
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  oauth:
    name: OAuth connection contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.package-artifact-name }}
          path: release/
      - name: Verify exact tested package
        env:
          EXPECTED_SHA256: ${{ inputs.package-sha256 }}
        run: |
          cd release
          sha256sum --check aculect-ai-companion.zip.sha256
          test "$(sha256sum aculect-ai-companion.zip | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          unzip -q aculect-ai-companion.zip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.19.0"
      - name: Configure disposable WordPress
        run: |
          node --input-type=module -e '
          import { writeFileSync } from "node:fs";
          writeFileSync(".wp-env.json", JSON.stringify({
            core: "https://wordpress.org/wordpress-7.1.zip",
            port: 8884, phpVersion: "8.2", testsEnvironment: false, plugins: [],
            mappings: {
              "wp-content/plugins/aculect-ai-companion": process.cwd() + "/release/aculect-ai-companion",
              "wp-content/aculect-oauth-proof": process.cwd() + "/tests/Integration/OAuth"
            }
          }));'
          npm install --global @wordpress/env@11.6.0
          wp-env start --update
      - name: Prepare isolated OAuth fixture
        run: |
          # Waiting for fixture boot is not a retry of a failed OAuth request.
          for attempt in $(seq 1 12); do
            if wp-env run cli wp core is-installed >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          wp-env run cli wp core is-installed
          wp-env run cli wp plugin activate aculect-ai-companion
          wp-env run cli wp user create workflow-admin workflow-admin@example.test --role=administrator --user_pass=workflow-admin-password
          wp-env run cli env ACULECT_OAUTH_FIXTURE_OPT_IN=1 wp eval 'require "wp-content/aculect-oauth-proof/setup.php";'
          npx playwright install --with-deps chromium
      - name: Prove OAuth contract without retries
        id: oauth
        env:
          ACULECT_WP_BASE_URL: http://localhost:8884
          ACULECT_WP_ADMIN_USER: workflow-admin
          ACULECT_WP_ADMIN_PASSWORD: workflow-admin-password
          ACULECT_OAUTH_FIXTURE_OPT_IN: "1"
        run: node tests/Integration/Browser/oauth-contract.mjs
      - name: Flag failure and owner approval boundary
        if: failure()
        env:
          CONTRACT_OUTCOME: ${{ steps.oauth.outcome }}
        run: |
          echo '::error::OAuth release gate failed. Release blocked. Diagnose the failed stage; explicit owner approval is required before changing OAuth behavior or weakening its tests.'
          if [ "$CONTRACT_OUTCOME" = failure ]; then
            echo 'OAuth contract failed on its first attempt. No automatic retry or authentication workaround is permitted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'OAuth environment/package setup failed before contract completion. This is not a passing OAuth test or proof of a product regression.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop disposable WordPress
        if: always()
        run: wp-env stop
  release:
    if: inputs.release-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.package-artifact-name }}
          path: release/
      - name: Verify exact package
        env:
          EXPECTED_SHA256: ${{ inputs.package-sha256 }}
        run: |
          cd release
          sha256sum --check aculect-ai-companion.zip.sha256
          test "$(sha256sum aculect-ai-companion.zip | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          unzip -q aculect-ai-companion.zip
      - name: Setup Node for locked browser dependencies
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Keep wp-env on its proven runtime; assets are already in the ZIP.
          node-version: "20.19.0"
      - name: Configure disposable packaged WordPress
        run: |
          PLUGIN_DIR="$(realpath release/aculect-ai-companion)"
          cat > .wp-env.json <<JSON
          {
            "core": "https://wordpress.org/wordpress-7.1.zip",
            "port": 8882,
            "testsEnvironment": false,
            "plugins": ["https://downloads.wordpress.org/plugin/plugin-check.zip"],
            "mappings": {
              "wp-content/plugins/aculect-ai-companion": "${PLUGIN_DIR}",
              "wp-content/aculect-memory-proofs": "${GITHUB_WORKSPACE}/tests/Integration/Memory"
            }
          }
          JSON
          npm install --global @wordpress/env@11.6.0
      - name: Start WordPress
        run: wp-env start --update
      - name: Check installable plugin
        run: |
          for attempt in $(seq 1 12); do
            if wp-env run cli wp core is-installed >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          wp-env run cli wp core is-installed
          wp-env run cli wp plugin activate aculect-ai-companion
          wp-env run cli wp plugin check aculect-ai-companion --format=json --ignore-warnings --exclude-files=.wp-env.json --slug=aculect-ai-companion --require=./wp-content/plugins/plugin-check/cli.php
      - name: Prove memory rollback, migration and sync on the installed ZIP
        run: wp-env run cli wp --user=admin eval-file wp-content/aculect-memory-proofs/wp-memory-proof.php aculect-disposable-memory-proof --use-include
      - name: Install Chromium for packaged admin proof
        run: npx playwright install --with-deps chromium
      - name: Create disposable browser administrator
        run: wp-env run cli wp user create workflow-admin workflow-admin@example.test --role=administrator --user_pass=workflow-admin-password
      - name: Prove packaged settings and removed workflow routes
        env:
          ACULECT_WP_BASE_URL: http://localhost:8882
          ACULECT_WP_ADMIN_USER: workflow-admin
          ACULECT_WP_ADMIN_PASSWORD: workflow-admin-password
        run: node tests/Integration/Browser/workflow-admin.mjs
      - name: Stop WordPress
        if: always()
        run: wp-env stop

  required:
    name: Required packaged proofs
    if: always()
    needs: [oauth, release]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require every selected package proof
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED: '{"oauth":true,"release":${{ inputs.release-proof }}}'
        run: node bin/ci-required.mjs

