name: Canonical Plugin Package

on:
  workflow_call:
    inputs:
      assets-built:
        type: boolean
        default: false
      assets-artifact-name:
        type: string
        default: ""
    outputs:
      artifact-name:
        description: Unique artifact name from this build attempt
        value: ${{ jobs.package.outputs.artifact-name }}
      sha256:
        description: SHA256 of the exact verified plugin archive
        value: ${{ jobs.package.outputs.sha256 }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: aculect-ai-companion-package-${{ github.sha }}-${{ github.run_attempt }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php82-

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !inputs.assets-built }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build assets once for release event
        if: ${{ !inputs.assets-built }}
        run: |
          npm ci
          npm run build
      - name: Require the upstream build artifact identity
        if: inputs.assets-built
        env:
          ASSET_ARTIFACT: ${{ inputs.assets-artifact-name }}
        run: test -n "$ASSET_ARTIFACT"
      - name: Download this CI run's built assets
        if: inputs.assets-built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.assets-artifact-name }}
          path: build/
      - name: Package and verify
        run: bash bin/ci-package.sh
      - name: Record immutable package checksum
        id: digest
        run: echo "sha256=$(cut -d ' ' -f 1 release/aculect-ai-companion.zip.sha256)" >> "$GITHUB_OUTPUT"
      - name: Upload canonical package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aculect-ai-companion-package-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/aculect-ai-companion.zip
            release/aculect-ai-companion.zip.sha256
          if-no-files-found: error
          retention-days: 3
