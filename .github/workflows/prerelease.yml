name: Build Plugin Pre-Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event.release.prerelease
    uses: ./.github/workflows/package.yml
  plugin-check:
    needs: package
    uses: ./.github/workflows/plugin-check.yml
    with:
      package-sha256: ${{ needs.package.outputs.sha256 }}
      package-artifact-name: ${{ needs.package.outputs.artifact-name }}
  publish:
    name: Attach verified prerelease artifact
    needs: [package, plugin-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release/
      - name: Attach one canonical ZIP and checksum without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: bash bin/ci-upload-release.sh
