name: Build Plugin Release

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production tag and main ancestry
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify production tag is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          expected_version="${RELEASE_TAG#v}"
          release_version="$(sed -n -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*$/\1/p' aculect-ai-companion.php | head -n 1)"
          main_version="$(git show origin/main:aculect-ai-companion.php | sed -n -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*$/\1/p' | head -n 1)"

          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Production release tag $RELEASE_TAG is not contained in main. Merge the exact tagged release commit into main before deployment." >&2
            exit 1
          fi

          if [ -z "$release_version" ] || [ "$release_version" != "$expected_version" ] || [ "$release_version" != "$main_version" ]; then
            echo "Production release tag $RELEASE_TAG expects version $expected_version, but tagged source is $release_version and main is $main_version." >&2
            exit 1
          fi


  package:
    needs: validate
    uses: ./.github/workflows/package.yml
  plugin-check:
    needs: package
    uses: ./.github/workflows/plugin-check.yml
    with:
      package-sha256: ${{ needs.package.outputs.sha256 }}
      package-artifact-name: ${{ needs.package.outputs.artifact-name }}
  publish:
    name: Publish verified production package
    needs: [validate, package, plugin-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release/
      - name: Verify exact package before publishing
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          cd release
          sha256sum --check aculect-ai-companion.zip.sha256
          test "$(sha256sum aculect-ai-companion.zip | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          unzip -q aculect-ai-companion.zip
      - name: Check existing assets before deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: bash bin/ci-upload-release.sh --check-only
      - name: Deploy verified package to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: aculect-ai-companion
          BUILD_DIR: release/aculect-ai-companion
          ASSETS_DIR: .wordpress-org
      - name: Attach one canonical ZIP and checksum without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: bash bin/ci-upload-release.sh
