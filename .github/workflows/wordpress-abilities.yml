name: WordPress Abilities Contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: WordPress ${{ matrix.wordpress }} Abilities contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.8.1"
          - "6.9"
          - "7.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php82-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.19.0"

      - name: Install wp-env
        run: npm install --global @wordpress/env@11.6.0

      - name: Configure wp-env
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          cat > .wp-env.json <<JSON
          {
            "core": "https://wordpress.org/wordpress-${WP_VERSION}.zip",
            "port": 8880,
            "testsEnvironment": false,
            "plugins": [],
            "mappings": {
              "wp-content/plugins/aculect-ai-companion": "${GITHUB_WORKSPACE}"
            }
          }
          JSON

      - name: Start WordPress
        run: wp-env start --update

      - name: Activate plugin
        run: wp-env run cli wp plugin activate aculect-ai-companion

      - name: Run native Abilities contract
        run: wp-env run cli wp eval-file wp-content/plugins/aculect-ai-companion/tests/Integration/WordPressAbilities/contract.php

      - name: Stop WordPress
        if: always()
        run: wp-env stop
