<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' __ACULECT_MEDIA_ORIGIN_CSP__; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Choose WordPress media</title><style>:root {
	font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	color-scheme: light dark;
	--page: #f5f7fa;
	--surface: #fff;
	--text: #152335;
	--muted: #526478;
	--border: #d7dfe8;
	--accent: #1554a8;
	--accent-soft: #eaf2ff;
	--good: #17634a;
	--bad: #9a3b31;
}

:root[data-theme="dark"] {
	--page: #111a25;
	--surface: #1c2836;
	--text: #f0f5fa;
	--muted: #b9c8d7;
	--border: #425365;
	--accent: #91bdff;
	--accent-soft: #243d5a;
	--good: #85d9b9;
	--bad: #ffaaa0;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: var(--page);
	color: var(--text);
}

main {
	max-width: 940px;
	margin: auto;
	padding: clamp(16px, 4vw, 32px);
}

header {
	margin-bottom: 22px;
}

.eyebrow {
	font-size: 0.76rem;
	font-weight: 800;
	letter-spacing: 0.1em;
	text-transform: uppercase;
	color: var(--accent);
	margin: 0 0 8px;
}

h1 {
	font-size: clamp(1.5rem, 3vw, 2rem);
	line-height: 1.2;
	margin: 0 0 10px;
}

.intro {
	color: var(--muted);
	margin: 0;
	max-width: 66ch;
}

.notice {
	border: 1px solid var(--border);
	border-radius: 10px;
	background: var(--surface);
	padding: 12px 16px;
	margin: 0 0 18px;
}

.notice[data-state="error"] {
	border-color: var(--bad);
}

.notice[data-state="selected"] {
	border-color: var(--good);
}

.filters {
	display: grid;
	grid-template-columns: minmax(180px, 2fr) minmax(140px, 1fr);
	gap: 12px;
	margin: 0 0 12px;
}

label {
	display: grid;
	gap: 5px;
	font-size: 0.8rem;
	font-weight: 700;
	color: var(--muted);
}

input,
select {
	font: inherit;
	color: var(--text);
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 8px;
	min-height: 42px;
	padding: 8px 10px;
	width: 100%;
}

button {
	font: inherit;
	cursor: pointer;
	color: var(--accent);
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 8px;
	min-height: 40px;
	padding: 7px 13px;
	font-weight: 700;
}

button:disabled,
button[aria-disabled="true"] {
	opacity: 0.55;
	cursor: not-allowed;
}

:focus-visible {
	outline: 3px solid var(--accent);
	outline-offset: 2px;
}

.count {
	color: var(--muted);
	font-size: 0.85rem;
	margin: 0 0 10px;
}

.cards {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
	gap: 14px;
}

.card {
	min-width: 0;
	border: 1px solid var(--border);
	border-radius: 12px;
	background: var(--surface);
	overflow: hidden;
}

.details {
	padding: 14px;
}

.card h2 {
	font-size: 1.08rem;
	line-height: 1.3;
	margin: 0 0 8px;
	overflow-wrap: anywhere;
}

.card p {
	margin: 0 0 9px;
}

.meta {
	color: var(--muted);
	font-size: 0.8rem;
	overflow-wrap: anywhere;
}

.url {
	max-height: 2.8em;
	overflow: hidden;
}

.excerpt {
	font-size: 0.88rem;
	max-height: 4.2em;
	overflow: hidden;
	overflow-wrap: anywhere;
}

.card button {
	width: 100%;
	margin-top: 5px;
}

.card button[aria-pressed="true"] {
	color: var(--good);
	border-color: var(--good);
}

button:hover:not(:disabled):not([aria-disabled="true"]) {
	background: var(--accent-soft);
	border-color: var(--accent);
}

.preview {
	height: 144px;
	background: var(--accent-soft);
	display: grid;
	place-items: center;
	color: var(--muted);
	font-size: 0.8rem;
}

.preview img {
	display: block;
	width: 100%;
	height: 144px;
	object-fit: contain;
}

.empty {
	padding: 22px;
	border: 1px dashed var(--border);
	border-radius: 10px;
	background: var(--surface);
}

.paging {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 12px;
	margin: 18px 0;
}

.paging span {
	font-size: 0.85rem;
	color: var(--muted);
}

:root[data-picker="content"] .cards {
	grid-template-columns: 1fr;
	gap: 8px;
}

:root[data-picker="content"] .card {
	display: flex;
	align-items: center;
}

:root[data-picker="content"] .details {
	display: grid;
	grid-template-columns: minmax(0, 1fr) auto;
	column-gap: 16px;
	width: 100%;
	align-items: center;
}

:root[data-picker="content"] .card h2,
:root[data-picker="content"] .card p {
	grid-column: 1;
}

:root[data-picker="content"] .card button {
	grid-column: 2;
	grid-row: 1/span 4;
	width: auto;
	white-space: nowrap;
}

@media (max-width: 610px) {

	.filters {
		grid-template-columns: 1fr;
	}

	.cards {
		grid-template-columns: 1fr;
	}

	main {
		padding: 16px;
	}

	:root[data-picker="content"] .details {
		grid-template-columns: 1fr;
	}

	:root[data-picker="content"] .card button {
		grid-column: 1;
		grid-row: auto;
		width: 100%;
	}
}
</style></head>
