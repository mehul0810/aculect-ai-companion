<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Choose a WordPress pattern</title>
	<style>:root {
	font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	color-scheme: light dark;
	--page: #f5f7fa;
	--surface: #fff;
	--text: #152335;
	--muted: #526478;
	--border: #d7dfe8;
	--accent: #1554a8;
	--accent-soft: #eaf2ff;
	--good: #17634a;
	--bad: #9a3b31;
	--shadow: 0 8px 24px rgb(28 49 80 / 7%);
}

:root[data-theme="dark"] {
	--page: #111a25;
	--surface: #1c2836;
	--text: #f0f5fa;
	--muted: #b9c8d7;
	--border: #425365;
	--accent: #91bdff;
	--accent-soft: #243d5a;
	--good: #85d9b9;
	--bad: #ffaaa0;
	--shadow: none;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: var(--page);
	color: var(--text);
}

main {
	max-width: 940px;
	margin: auto;
	padding: clamp(16px, 4vw, 32px);
}

header {
	margin-bottom: 24px;
}

.eyebrow {
	font-size: 0.76rem;
	font-weight: 800;
	letter-spacing: 0.1em;
	text-transform: uppercase;
	color: var(--accent);
	margin: 0 0 8px;
}

h1 {
	font-size: clamp(1.5rem, 3vw, 2rem);
	line-height: 1.18;
	margin: 0 0 10px;
}

.intro {
	color: var(--muted);
	margin: 0;
	max-width: 66ch;
}

.notice {
	border: 1px solid var(--border);
	border-radius: 10px;
	background: var(--surface);
	padding: 12px 16px;
	margin: 0 0 18px;
}

.notice[data-state="error"] {
	border-color: var(--bad);
}

.notice[data-state="selected"] {
	border-color: var(--good);
}

.filters {
	display: grid;
	grid-template-columns: minmax(180px, 2fr) repeat(2, minmax(140px, 1fr));
	gap: 12px;
	margin: 0 0 12px;
}

label {
	display: grid;
	gap: 5px;
	font-size: 0.8rem;
	font-weight: 700;
	color: var(--muted);
}

input,
select {
	font: inherit;
	color: var(--text);
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 8px;
	min-height: 42px;
	padding: 8px 10px;
	width: 100%;
}

button {
	font: inherit;
	cursor: pointer;
	color: var(--accent);
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 8px;
	min-height: 40px;
	padding: 7px 13px;
	font-weight: 700;
}

button:disabled {
	opacity: 0.55;
	cursor: not-allowed;
}

:focus-visible {
	outline: 3px solid var(--accent);
	outline-offset: 2px;
}

.count {
	color: var(--muted);
	font-size: 0.85rem;
	margin: 0 0 10px;
}

.cards {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
	gap: 14px;
}

.card {
	min-width: 0;
	border: 1px solid var(--border);
	border-radius: 12px;
	padding: 16px;
	background: var(--surface);
	box-shadow: var(--shadow);
}

.card h2 {
	font-size: 1.08rem;
	line-height: 1.3;
	margin: 7px 0;
	overflow-wrap: anywhere;
}

.card p {
	margin: 0 0 10px;
}

.meta {
	color: var(--muted);
	font-size: 0.8rem;
	overflow-wrap: anywhere;
}

.badge {
	display: inline-block;
	border-radius: 100px;
	background: var(--accent-soft);
	padding: 3px 9px;
	font-size: 0.72rem;
	font-weight: 700;
	color: var(--accent);
}

.badge[data-state="incompatible"] {
	color: var(--bad);
}

.badge[data-state="compatible"] {
	color: var(--good);
}

.preview {
	border: 1px solid var(--border);
	border-radius: 8px;
	background: var(--page);
	padding: 11px;
	margin: 12px 0;
	min-height: 72px;
	display: grid;
	gap: 6px;
}

.preview-label {
	font-size: 0.68rem;
	color: var(--muted);
	font-weight: 800;
	text-transform: uppercase;
	letter-spacing: 0.06em;
}

.preview-row {
	display: flex;
	gap: 5px;
	flex-wrap: wrap;
}

.preview-chip {
	background: var(--surface);
	border: 1px solid var(--border);
	border-radius: 4px;
	padding: 2px 6px;
	font-size: 0.72rem;
	color: var(--muted);
}

.card button {
	width: 100%;
}

button:hover:not(:disabled) {
	background: var(--accent-soft);
	border-color: var(--accent);
}

.card button[aria-pressed="true"] {
	border-color: var(--good);
	color: var(--good);
}

.empty {
	padding: 22px;
	border: 1px dashed var(--border);
	border-radius: 10px;
	background: var(--surface);
}

.paging {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 12px;
	margin: 18px 0;
}

.paging span {
	font-size: 0.85rem;
	color: var(--muted);
}

@media (max-width: 610px) {

	.filters {
		grid-template-columns: 1fr;
	}

	.cards {
		grid-template-columns: 1fr;
	}

	main {
		padding: 16px;
	}
}
</style>
</head>
<body>
	<main aria-labelledby="heading">
		<header>
			<p class="eyebrow">WordPress patterns</p>
			<h1 id="heading">Choose a layout</h1>
			<p class="intro">Explore patterns available on this site. Choosing one shares its identifier with the assistant; it does not add content.</p>
		</header>
		<div id="notice" class="notice" role="status" aria-live="polite">Waiting for available patterns.</div>
		<section id="picker" hidden aria-label="Available patterns">
			<div class="filters">
				<label>Search patterns<input id="search" type="search" maxlength="100" autocomplete="off" placeholder="Title, category, block…"></label>
				<label>Source<select id="source"><option value="">All sources</option></select></label>
				<label>Compatibility<select id="compatibility"><option value="">All statuses</option><option value="compatible">Compatible</option><option value="incompatible">Incompatible</option><option value="unknown">Not verified</option></select></label>
			</div>
			<p id="count" class="count" role="status" aria-live="polite"></p>
			<div id="cards" class="cards" role="list"></div>
			<p id="empty" class="empty" hidden>No patterns match these filters. Clear a filter or ask the assistant to refresh the list.</p>
			<div class="paging"><button id="previous" type="button">Previous</button><span id="page-label"></span><button id="next" type="button">Next</button></div>
		</section>
	</main>
	<script>/* MCP Apps bridge. */
( ( scope ) => {
	const PROTOCOL = '2026-01-26';
	const RPC = '2.0';
	const MAX_PENDING = 16;
	const isRecord = ( value ) =>
		value !== null && typeof value === 'object' && ! Array.isArray( value );

	function createBridge( options ) {
		const view = options.windowRef;
		const parent = view.parent;
		const allowedTools = new Set( options.readOnlyTools ?? [] );
		const pending = new Map();
		let nextId = 1;
		let connected = false;
		let closed = false;
		let started = false;
		let hostContext = {};
		const timeoutMs = Math.min(
			30000,
			Math.max( 1000, options.timeoutMs ?? 10000 )
		);

		function notify( method, params = {} ) {
			parent.postMessage( { jsonrpc: RPC, method, params }, '*' );
		}

		function request( method, params ) {
			if ( closed || pending.size >= MAX_PENDING ) {
				return Promise.reject(
					new Error( 'Widget bridge is unavailable.' )
				);
			}
			const id = nextId++;
			return new Promise( ( resolve, reject ) => {
				const timer = view.setTimeout( () => {
					pending.delete( id );
					reject( new Error( 'Host did not respond.' ) );
				}, timeoutMs );
				pending.set( id, { resolve, reject, timer } );
				parent.postMessage( { jsonrpc: RPC, id, method, params }, '*' );
			} );
		}

		function finishResponse( message ) {
			const item = pending.get( message.id );
			if ( ! item ) {
				return;
			}
			pending.delete( message.id );
			view.clearTimeout( item.timer );
			if ( isRecord( message.error ) ) {
				item.reject( new Error( 'The host declined the request.' ) );
			} else if ( Object.hasOwn( message, 'result' ) ) {
				item.resolve( message.result );
			} else {
				item.reject( new Error( 'Invalid host response.' ) );
			}
		}

		function receive( event ) {
			if (
				closed ||
				event.source !== parent ||
				! isRecord( event.data )
			) {
				return;
			}
			const message = event.data;
			if ( message.jsonrpc !== RPC ) {
				return;
			}
			if (
				Number.isSafeInteger( message.id ) &&
				! Object.hasOwn( message, 'method' )
			) {
				finishResponse( message );
				return;
			}
			if ( ! connected || typeof message.method !== 'string' ) {
				return;
			}
			if ( message.method === 'ui/resource-teardown' ) {
				if (
					Number.isSafeInteger( message.id ) ||
					( typeof message.id === 'string' &&
						message.id.length <= 128 )
				) {
					parent.postMessage(
						{ jsonrpc: RPC, id: message.id, result: {} },
						'*'
					);
				}
				close();
				return;
			}
			if (
				message.method === 'ui/notifications/host-context-changed' &&
				isRecord( message.params )
			) {
				hostContext = { ...hostContext, ...message.params };
				options.onEvent( {
					type: 'host-context',
					context: { ...hostContext },
				} );
				return;
			}
			const eventTypes = {
				'ui/notifications/tool-input': 'tool-input',
				'ui/notifications/tool-input-partial': 'tool-input-partial',
				'ui/notifications/tool-result': 'tool-result',
				'ui/notifications/tool-cancelled': 'tool-cancelled',
			};
			if ( Object.hasOwn( eventTypes, message.method ) ) {
				options.onEvent( {
					type: eventTypes[ message.method ],
					params: message.params,
				} );
			}
		}

		function close() {
			if ( closed ) {
				return;
			}
			closed = true;
			connected = false;
			view.removeEventListener( 'message', receive );
			for ( const item of pending.values() ) {
				view.clearTimeout( item.timer );
				item.reject( new Error( 'Widget bridge closed.' ) );
			}
			pending.clear();
			options.onEvent( { type: 'closed' } );
		}

		async function start() {
			if ( started || parent === view ) {
				throw new Error( 'Widget needs a host iframe.' );
			}
			started = true;
			view.addEventListener( 'message', receive );
			try {
				const result = await request( 'ui/initialize', {
					protocolVersion: PROTOCOL,
					appInfo: options.appInfo,
					appCapabilities: {
						availableDisplayModes: [ 'inline', 'fullscreen' ],
					},
				} );
				if (
					! isRecord( result ) ||
					result.protocolVersion !== PROTOCOL
				) {
					throw new Error( 'Unsupported MCP Apps host.' );
				}
				hostContext = isRecord( result.hostContext )
					? result.hostContext
					: {};
				connected = true;
				notify( 'ui/notifications/initialized' );
				options.onEvent( {
					type: 'ready',
					context: { ...hostContext },
				} );
			} catch ( error ) {
				close();
				throw error;
			}
		}

		function callReadOnlyTool( name, args = {} ) {
			if (
				! connected ||
				! allowedTools.has( name ) ||
				! isRecord( args )
			) {
				return Promise.reject(
					new Error( 'Tool call is not permitted by this widget.' )
				);
			}
			return request( 'tools/call', { name, arguments: args } );
		}

		function openLink( url ) {
			let parsed;
			try {
				parsed = new URL( url );
			} catch {
				/* Invalid URL. */
			}
			if ( ! connected || ! parsed || parsed.protocol !== 'https:' ) {
				return Promise.reject(
					new Error( 'Only HTTPS links are supported.' )
				);
			}
			return request( 'ui/open-link', { url: parsed.href } );
		}

		function updateModelContext( content ) {
			if (
				! connected ||
				! isRecord( content ) ||
				JSON.stringify( content ).length > 16384
			) {
				return Promise.reject(
					new Error( 'Invalid model context update.' )
				);
			}
			return request( 'ui/update-model-context', content );
		}

		function requestDisplayMode( mode ) {
			if (
				! connected ||
				! [ 'inline', 'fullscreen' ].includes( mode ) ||
				! hostContext.availableDisplayModes?.includes( mode )
			) {
				return Promise.reject(
					new Error( 'Display mode is unavailable.' )
				);
			}
			return request( 'ui/request-display-mode', { mode } );
		}

		// ChatGPT additions are optional and never part of baseline transport.
		function optionalOpenAI() {
			const api = view.openai;
			return Object.freeze( {
				openExternal:
					typeof api?.openExternal === 'function'
						? ( url ) => api.openExternal( { href: url } )
						: null,
			} );
		}

		return Object.freeze( {
			start,
			close,
			callReadOnlyTool,
			openLink,
			updateModelContext,
			requestDisplayMode,
			optionalOpenAI,
			isConnected: () => connected,
			getHostContext: () => ( { ...hostContext } ),
		} );
	}

	scope.AculectWidgetBridge = Object.freeze( { createBridge, PROTOCOL } );
} )( globalThis );

/* Strict projection of server-provided pattern metadata. Never accepts markup. */
( ( scope ) => {
	const SCHEMA = 'aculect.pattern-picker.v1';
	const MAX_ITEMS = 100;
	const ID = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_./-]{1,159}$/;
	const STATES = new Set( [ 'compatible', 'incompatible', 'unknown' ] );
	const record = ( value ) =>
		value !== null && typeof value === 'object' && ! Array.isArray( value );
	const text = ( value, max = 160 ) =>
		typeof value === 'string' ? value.trim().slice( 0, max ) : '';
	const list = ( value, max = 8 ) =>
		Array.isArray( value )
			? value
					.slice( 0, max )
					.map( ( item ) => text( item, 64 ) )
					.filter( Boolean )
			: [];
	function parse( result ) {
		if ( ! record( result ) || result.isError ) {
			return { state: 'error', items: [] };
		}
		const data = result.structuredContent;
		if ( ! record( data ) || ( data.schema && data.schema !== SCHEMA ) ) {
			return { state: 'error', items: [] };
		}
		if ( [ 'stale', 'unavailable' ].includes( data.status ) ) {
			return { state: data.status, items: [] };
		}
		if ( ! Array.isArray( data.items ) ) {
			return { state: 'error', items: [] };
		}
		const seen = new Set();
		const items = [];
		for ( const item of data.items.slice( 0, MAX_ITEMS ) ) {
			const id = record( item ) ? item.id || item.name : '';
			if ( typeof id !== 'string' || ! ID.test( id ) || seen.has( id ) ) {
				continue;
			}
			seen.add( id );
			const categoryLabels = record( item.category_labels )
				? Object.values( item.category_labels )
				: [];
			const category =
				text( item.category, 80 ) ||
				text( categoryLabels[ 0 ], 80 ) ||
				list( item.categories, 1 )[ 0 ];
			const blocks = list(
				item.supported_blocks || item.content_blocks || item.block_types
			);
			items.push( {
				id,
				title: text( item.title, 180 ) || id,
				category: category || 'Uncategorized',
				source: text( item.source, 48 ) || 'Not specified',
				compatibility: STATES.has( item.compatibility )
					? item.compatibility
					: 'unknown',
				blocks,
				contentType:
					text( item.content_type, 64 ) ||
					list( item.post_types, 1 )[ 0 ] ||
					'',
				message: text( item.compatibility_message, 220 ),
			} );
		}
		return {
			state: 'ready',
			items,
			truncated: data.items.length > MAX_ITEMS,
			total:
				Number.isSafeInteger( data.total ) && data.total >= items.length
					? data.total
					: items.length,
		};
	}
	scope.AculectPatternPickerContract = Object.freeze( {
		SCHEMA,
		MAX_ITEMS,
		parse,
	} );
} )( globalThis );

/* Selection only: no write tool, pattern markup, or unreviewed network fetch. */
( ( scope ) => {
	const doc = scope.document;
	const contract = scope.AculectPatternPickerContract;
	const bridge = scope.AculectWidgetBridge.createBridge( {
		windowRef: scope,
		appInfo: { name: 'Aculect Pattern Picker', version: '1.0.0' },
		readOnlyTools: [],
		onEvent: receive,
	} );
	const el = Object.fromEntries(
		[
			'notice',
			'picker',
			'search',
			'source',
			'compatibility',
			'count',
			'cards',
			'empty',
			'previous',
			'next',
			'page-label',
		].map( ( id ) => [ id, doc.getElementById( id ) ] )
	);
	const PAGE_SIZE = 12;
	const messages = {
		loading: 'Waiting for available patterns.',
		ready: 'Choose a compatible pattern to share its identifier with the assistant.',
		empty: 'No patterns were returned. Ask the assistant to refresh the site inventory.',
		stale: 'This pattern list is out of date. Ask the assistant to refresh it before choosing.',
		unavailable:
			'Patterns are unavailable or your access has changed. Check WordPress and try again.',
		error: 'The pattern list could not be displayed. Ask the assistant to retry discovery.',
		cancelled:
			'Pattern discovery was cancelled. Ask the assistant to try again.',
		disabled:
			'This interactive picker is unavailable. Use the text list in your host.',
	};
	let data = { state: 'loading', items: [] };
	let context = {};
	let page = 1;
	let selected = '';
	let pending = '';
	let selectionError = '';

	function element( tag, className, value ) {
		const node = doc.createElement( tag );
		if ( className ) {
			node.className = className;
		}
		if ( value !== undefined ) {
			node.textContent = value;
		}
		return node;
	}

	function card( item ) {
		const article = element( 'article', 'card' );
		article.setAttribute( 'role', 'listitem' );
		article.append(
			element(
				'span',
				'badge',
				item.compatibility === 'unknown'
					? 'Not verified'
					: item.compatibility
			)
		);
		article.firstChild.dataset.state = item.compatibility;
		article.append( element( 'h2', '', item.title ) );
		article.append(
			element(
				'p',
				'meta',
				`${ item.category } · ${ item.source }${
					item.contentType ? ` · ${ item.contentType }` : ''
				}`
			)
		);
		const preview = element( 'div', 'preview' );
		preview.setAttribute(
			'aria-label',
			'Semantic preview, not a screenshot'
		);
		preview.append(
			element( 'span', 'preview-label', 'Block information' )
		);
		const row = element( 'div', 'preview-row' );
		for ( const block of item.blocks.length
			? item.blocks
			: [ 'Block details unavailable' ] ) {
			row.append( element( 'span', 'preview-chip', block ) );
		}
		preview.append( row );
		article.append( preview );
		if ( item.message ) {
			article.append( element( 'p', 'meta', item.message ) );
		}
		const button = element(
			'button',
			'',
			selected === item.id ? 'Selected' : 'Choose pattern'
		);
		button.type = 'button';
		button.dataset.id = item.id;
		button.setAttribute(
			'aria-label',
			`${ selected === item.id ? 'Selected' : 'Choose' } ${ item.title }`
		);
		button.setAttribute( 'aria-pressed', String( selected === item.id ) );
		button.disabled =
			item.compatibility !== 'compatible' ||
			Boolean( pending ) ||
			! bridge.isConnected();
		article.append( button );
		return article;
	}

	function filtered() {
		const query = el.search.value.trim().toLocaleLowerCase();
		return data.items.filter( ( item ) => {
			const searchable = [
				item.title,
				item.id,
				item.category,
				item.source,
				item.contentType,
				...item.blocks,
			]
				.join( ' ' )
				.toLocaleLowerCase();
			return (
				( ! query || searchable.includes( query ) ) &&
				( ! el.source.value || item.source === el.source.value ) &&
				( ! el.compatibility.value ||
					item.compatibility === el.compatibility.value )
			);
		} );
	}

	function sources() {
		const previous = el.source.value;
		const all = element( 'option', '', 'All sources' );
		all.value = '';
		el.source.replaceChildren( all );
		for ( const source of [
			...new Set( data.items.map( ( item ) => item.source ) ),
		].sort() ) {
			const option = element(
				'option',
				'',
				source[ 0 ].toUpperCase() + source.slice( 1 )
			);
			option.value = source;
			el.source.append( option );
		}
		el.source.value = [ ...el.source.options ].some(
			( option ) => option.value === previous
		)
			? previous
			: '';
	}

	function render() {
		doc.documentElement.dataset.theme = [ 'light', 'dark' ].includes(
			context.theme
		)
			? context.theme
			: 'auto';
		const state =
			data.state === 'ready' && ! data.items.length
				? 'empty'
				: data.state;
		el.notice.dataset.state = state;
		el.notice.textContent = messages[ state ] || messages.error;
		if ( selected ) {
			el.notice.dataset.state = 'selected';
			el.notice.textContent = `Selected ${ selected }. Nothing has been inserted.`;
		}
		if ( pending ) {
			el.notice.textContent =
				'Sharing the selected identifier with the assistant…';
		}
		if ( selectionError ) {
			el.notice.dataset.state = 'error';
			el.notice.textContent = selectionError;
		}
		el.picker.hidden = data.state !== 'ready' || ! data.items.length;
		if ( el.picker.hidden ) {
			return;
		}
		const items = filtered();
		const pages = Math.max( 1, Math.ceil( items.length / PAGE_SIZE ) );
		page = Math.min( page, pages );
		const moreOnServer = data.total > data.items.length;
		let countSuffix = '.';
		if ( moreOnServer ) {
			countSuffix = `, from ${ data.total } server matches. Ask the assistant for the next discovery page to see more.`;
		} else if ( data.truncated ) {
			countSuffix =
				'. Only the first 100 returned can be shown; refine discovery to see more.';
		}
		el.count.textContent = `${ items.length } matching pattern${
			items.length === 1 ? '' : 's'
		} in this response${ countSuffix }`;
		el.cards.replaceChildren(
			...items
				.slice( ( page - 1 ) * PAGE_SIZE, page * PAGE_SIZE )
				.map( card )
		);
		el.empty.hidden = items.length !== 0;
		el.previous.disabled = page <= 1;
		el.next.disabled = page >= pages;
		el[ 'page-label' ].textContent = `Page ${ page } of ${ pages }`;
	}

	function receive( event ) {
		switch ( event.type ) {
			case 'ready':
			case 'host-context':
				context = { ...context, ...event.context };
				break;
			case 'tool-input':
				data = { state: 'loading', items: [] };
				selected = '';
				break;
			case 'tool-result':
				data = contract.parse( event.params );
				selected = '';
				page = 1;
				sources();
				break;
			case 'tool-cancelled':
				data = { state: 'cancelled', items: [] };
				break;
			case 'closed':
				data = { state: 'disabled', items: [] };
				break;
		}
		selectionError = '';
		render();
	}

	async function choose( id ) {
		const item = data.items.find( ( candidate ) => candidate.id === id );
		if (
			! item ||
			item.compatibility !== 'compatible' ||
			pending ||
			! bridge.isConnected()
		) {
			return;
		}
		pending = id;
		selectionError = '';
		render();
		try {
			await bridge.updateModelContext( {
				structuredContent: {
					schema: 'aculect.pattern-selection.v1',
					pattern_id: id,
				},
			} );
			selected = id;
		} catch {
			selectionError =
				'The host could not accept this selection. Nothing was inserted. Try again or use the text list.';
		} finally {
			pending = '';
			render();
			const active = [
				...el.cards.querySelectorAll( 'button[data-id]' ),
			].find( ( button ) => button.dataset.id === id );
			active?.focus();
		}
	}

	el.search.addEventListener( 'input', () => {
		page = 1;
		render();
	} );
	for ( const control of [ el.source, el.compatibility ] ) {
		control.addEventListener( 'change', () => {
			page = 1;
			render();
		} );
	}
	el.previous.addEventListener( 'click', () => {
		page--;
		render();
		el.previous.focus();
	} );
	el.next.addEventListener( 'click', () => {
		page++;
		render();
		el.next.focus();
	} );
	el.cards.addEventListener( 'click', ( event ) => {
		const button = event.target.closest( 'button[data-id]' );
		if ( button ) {
			choose( button.dataset.id );
		}
	} );
	scope.AculectPatternPickerFixture = Object.freeze( {
		showResult( result ) {
			data = contract.parse( result );
			selected = '';
			page = 1;
			sources();
			render();
		},
	} );
	render();
	bridge.start().catch( () => {
		data = { state: 'disabled', items: [] };
		render();
	} );
} )( globalThis );
</script>
</body>
</html>
