<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
	<title>Aculect widget fixture</title>
	<style>:root {
	color-scheme: light dark;
	font:
		15px/1.45 system-ui,
		sans-serif;
	--surface: #fff;
	--text: #1d2327;
	--muted: #50575e;
	--border: #c3c4c7;
	--accent: #135e96;
	--danger: #b32d2e;
}

:root[data-theme="dark"] {
	color-scheme: dark;
	--surface: #1d2327;
	--text: #f0f0f1;
	--muted: #c3c4c7;
	--border: #646970;
	--accent: #72aee6;
	--danger: #ff8085;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	padding: 8px;
	color: var(--text);
	background: transparent;
}

button {
	font: inherit;
}

.card {
	max-width: 560px;
	margin: 0 auto;
	padding: clamp(16px, 4vw, 24px);
	border: 1px solid var(--border);
	border-radius: 12px;
	background: var(--surface);
}

:root[data-display-mode="fullscreen"] .card {
	max-width: 900px;
}

.eyebrow {
	margin: 0 0 4px;
	color: var(--muted);
	font-size: 0.78rem;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.04em;
}

h1 {
	margin: 0;
	font-size: clamp(1.2rem, 4vw, 1.5rem);
	line-height: 1.25;
	overflow-wrap: anywhere;
}

#site-url {
	margin: 4px 0 0;
	color: var(--muted);
	overflow-wrap: anywhere;
}

#status {
	margin: 16px 0;
	color: var(--muted);
}

#status[data-state="error"] {
	color: var(--danger);
}

dl {
	display: grid;
	grid-template-columns: minmax(100px, 0.65fr) minmax(0, 1.35fr);
	margin: 0 0 16px;
	border-top: 1px solid var(--border);
}

dt,
dd {
	margin: 0;
	padding: 10px 0;
	border-bottom: 1px solid var(--border);
	overflow-wrap: anywhere;
}

dt {
	color: var(--muted);
}

dd {
	font-weight: 600;
}

.actions {
	display: flex;
	flex-wrap: wrap;
	gap: 8px;
}

dialog button,
.actions button {
	min-height: 44px;
	padding: 8px 12px;
	border: 1px solid var(--accent);
	border-radius: 6px;
	color: var(--accent);
	background: var(--surface);
	cursor: pointer;
}

button:disabled {
	opacity: 0.55;
	cursor: not-allowed;
}

button:focus-visible {
	outline: 3px solid var(--accent);
	outline-offset: 2px;
}

button:hover:not(:disabled) {
	text-decoration: underline;
}

dialog {
	max-width: min(420px, calc(100vw - 32px));
	border: 1px solid var(--border);
	border-radius: 8px;
	color: var(--text);
	background: var(--surface);
}

dialog::backdrop {
	background: rgb(0 0 0 / 55%);
}

[hidden] {
	display: none !important;
}

@media (max-width: 360px) {

	dl {
		grid-template-columns: 1fr;
	}

	dt {
		padding-bottom: 2px;
		border-bottom: 0;
	}

	dd {
		padding-top: 0;
	}

	.actions button {
		flex: 1 1 100%;
	}
}

@media (prefers-reduced-motion: reduce) {

	*,
	*::before,
	*::after {
		animation-duration: 0s !important;
		transition-duration: 0s !important;
	}
}
</style>
</head>
<body>
	<main class="card" aria-labelledby="title">
		<p class="eyebrow">WordPress site</p>
		<h1 id="title">Connected site</h1>
		<p id="site-url" hidden></p>
		<p id="status" role="status" aria-live="polite">Loading site information…</p>
		<dl id="details" aria-label="Site details" hidden>
			<dt>WordPress</dt><dd data-field="wordpress"></dd>
			<dt>Theme</dt><dd data-field="theme"></dd>
			<dt>Locale</dt><dd data-field="locale"></dd>
			<dt>Time zone</dt><dd data-field="timezone"></dd>
		</dl>
		<div class="actions">
			<button id="refresh" type="button" disabled>Refresh</button>
			<button id="open-site" type="button" hidden>Open site</button>
			<button id="expand" type="button" hidden>Expand</button>
			<button id="share" type="button" hidden>Share site name with assistant</button>
			<button id="about" type="button">About this view</button>
		</div>
	</main>
	<dialog id="about-dialog" aria-labelledby="dialog-title">
		<h2 id="dialog-title">About this view</h2>
		<p>This fixture uses the connected site's read-only information tool. The host decides whether to open links or change display mode.</p>
		<button id="close-dialog" type="button">Close</button>
	</dialog>
	<script>/* Ephemeral, host-independent widget state. No storage or WordPress globals. */
( ( scope ) => {
	const kinds = Object.freeze( [
		'loading',
		'empty',
		'error',
		'stale',
		'disabled',
		'approval-pending',
		'completed',
	] );
	const messages = Object.freeze( {
		loading: 'Loading site information…',
		empty: 'No site information is available.',
		error: 'Site information could not be loaded.',
		stale: 'This information may be out of date.',
		disabled: 'This view is unavailable.',
		'approval-pending': 'Waiting for approval in the host.',
		completed: 'Site information loaded.',
	} );

	function state( kind, data = null ) {
		if ( ! kinds.includes( kind ) ) {
			throw new TypeError( 'Unsupported widget state.' );
		}
		return { kind, message: messages[ kind ], data };
	}

	function isRecord( value ) {
		return (
			value !== null &&
			typeof value === 'object' &&
			! Array.isArray( value )
		);
	}

	function resultData( result ) {
		if ( ! isRecord( result ) ) {
			return null;
		}
		if ( isRecord( result.structuredContent ) ) {
			return result.structuredContent;
		}
		if ( ! Array.isArray( result.content ) ) {
			return null;
		}
		const block = result.content.find(
			( item ) =>
				isRecord( item ) &&
				item.type === 'text' &&
				typeof item.text === 'string'
		);
		if ( ! block ) {
			return null;
		}
		try {
			const parsed = JSON.parse( block.text );
			return isRecord( parsed ) ? parsed : null;
		} catch {
			return null;
		}
	}

	function reduce( previous, event ) {
		if ( ! isRecord( event ) ) {
			return previous;
		}
		switch ( event.type ) {
			case 'loading':
				return state( 'loading' );
			case 'result': {
				if ( event.result?.isError ) {
					return state( 'error' );
				}
				const data = resultData( event.result );
				return data && Object.keys( data ).length
					? state( 'completed', data )
					: state( 'empty' );
			}
			case 'cancelled':
			case 'error':
				return state( 'error' );
			case 'stale':
			case 'disabled':
			case 'approval-pending':
			case 'empty':
				return state( event.type, previous?.data ?? null );
			default:
				return previous;
		}
	}

	scope.AculectWidgetState = Object.freeze( {
		kinds,
		state,
		reduce,
		resultData,
	} );
} )( globalThis );

/* MCP Apps bridge. */
( ( scope ) => {
	const PROTOCOL = '2026-01-26';
	const RPC = '2.0';
	const MAX_PENDING = 16;
	const isRecord = ( value ) =>
		value !== null && typeof value === 'object' && ! Array.isArray( value );

	function createBridge( options ) {
		const view = options.windowRef;
		const parent = view.parent;
		const allowedTools = new Set( options.readOnlyTools ?? [] );
		const pending = new Map();
		let nextId = 1;
		let connected = false;
		let closed = false;
		let started = false;
		let hostContext = {};
		const timeoutMs = Math.min(
			30000,
			Math.max( 1000, options.timeoutMs ?? 10000 )
		);

		function notify( method, params = {} ) {
			parent.postMessage( { jsonrpc: RPC, method, params }, '*' );
		}

		function request( method, params ) {
			if ( closed || pending.size >= MAX_PENDING ) {
				return Promise.reject(
					new Error( 'Widget bridge is unavailable.' )
				);
			}
			const id = nextId++;
			return new Promise( ( resolve, reject ) => {
				const timer = view.setTimeout( () => {
					pending.delete( id );
					reject( new Error( 'Host did not respond.' ) );
				}, timeoutMs );
				pending.set( id, { resolve, reject, timer } );
				parent.postMessage( { jsonrpc: RPC, id, method, params }, '*' );
			} );
		}

		function finishResponse( message ) {
			const item = pending.get( message.id );
			if ( ! item ) {
				return;
			}
			pending.delete( message.id );
			view.clearTimeout( item.timer );
			if ( isRecord( message.error ) ) {
				item.reject( new Error( 'The host declined the request.' ) );
			} else if ( Object.hasOwn( message, 'result' ) ) {
				item.resolve( message.result );
			} else {
				item.reject( new Error( 'Invalid host response.' ) );
			}
		}

		function receive( event ) {
			if (
				closed ||
				event.source !== parent ||
				! isRecord( event.data )
			) {
				return;
			}
			const message = event.data;
			if ( message.jsonrpc !== RPC ) {
				return;
			}
			if (
				Number.isSafeInteger( message.id ) &&
				! Object.hasOwn( message, 'method' )
			) {
				finishResponse( message );
				return;
			}
			if ( ! connected || typeof message.method !== 'string' ) {
				return;
			}
			if ( message.method === 'ui/resource-teardown' ) {
				if (
					Number.isSafeInteger( message.id ) ||
					( typeof message.id === 'string' &&
						message.id.length <= 128 )
				) {
					parent.postMessage(
						{ jsonrpc: RPC, id: message.id, result: {} },
						'*'
					);
				}
				close();
				return;
			}
			if (
				message.method === 'ui/notifications/host-context-changed' &&
				isRecord( message.params )
			) {
				hostContext = { ...hostContext, ...message.params };
				options.onEvent( {
					type: 'host-context',
					context: { ...hostContext },
				} );
				return;
			}
			const eventTypes = {
				'ui/notifications/tool-input': 'tool-input',
				'ui/notifications/tool-input-partial': 'tool-input-partial',
				'ui/notifications/tool-result': 'tool-result',
				'ui/notifications/tool-cancelled': 'tool-cancelled',
			};
			if ( Object.hasOwn( eventTypes, message.method ) ) {
				options.onEvent( {
					type: eventTypes[ message.method ],
					params: message.params,
				} );
			}
		}

		function close() {
			if ( closed ) {
				return;
			}
			closed = true;
			connected = false;
			view.removeEventListener( 'message', receive );
			for ( const item of pending.values() ) {
				view.clearTimeout( item.timer );
				item.reject( new Error( 'Widget bridge closed.' ) );
			}
			pending.clear();
			options.onEvent( { type: 'closed' } );
		}

		async function start() {
			if ( started || parent === view ) {
				throw new Error( 'Widget needs a host iframe.' );
			}
			started = true;
			view.addEventListener( 'message', receive );
			try {
				const result = await request( 'ui/initialize', {
					protocolVersion: PROTOCOL,
					appInfo: options.appInfo,
					appCapabilities: {
						availableDisplayModes: [ 'inline', 'fullscreen' ],
					},
				} );
				if (
					! isRecord( result ) ||
					result.protocolVersion !== PROTOCOL
				) {
					throw new Error( 'Unsupported MCP Apps host.' );
				}
				hostContext = isRecord( result.hostContext )
					? result.hostContext
					: {};
				connected = true;
				notify( 'ui/notifications/initialized' );
				options.onEvent( {
					type: 'ready',
					context: { ...hostContext },
				} );
			} catch ( error ) {
				close();
				throw error;
			}
		}

		function callReadOnlyTool( name, args = {} ) {
			if (
				! connected ||
				! allowedTools.has( name ) ||
				! isRecord( args )
			) {
				return Promise.reject(
					new Error( 'Tool call is not permitted by this widget.' )
				);
			}
			return request( 'tools/call', { name, arguments: args } );
		}

		function openLink( url ) {
			let parsed;
			try {
				parsed = new URL( url );
			} catch {
				/* Invalid URL. */
			}
			if ( ! connected || ! parsed || parsed.protocol !== 'https:' ) {
				return Promise.reject(
					new Error( 'Only HTTPS links are supported.' )
				);
			}
			return request( 'ui/open-link', { url: parsed.href } );
		}

		function updateModelContext( content ) {
			if (
				! connected ||
				! isRecord( content ) ||
				JSON.stringify( content ).length > 16384
			) {
				return Promise.reject(
					new Error( 'Invalid model context update.' )
				);
			}
			return request( 'ui/update-model-context', content );
		}

		function requestDisplayMode( mode ) {
			if (
				! connected ||
				! [ 'inline', 'fullscreen' ].includes( mode ) ||
				! hostContext.availableDisplayModes?.includes( mode )
			) {
				return Promise.reject(
					new Error( 'Display mode is unavailable.' )
				);
			}
			return request( 'ui/request-display-mode', { mode } );
		}

		// ChatGPT additions are optional and never part of baseline transport.
		function optionalOpenAI() {
			const api = view.openai;
			return Object.freeze( {
				openExternal:
					typeof api?.openExternal === 'function'
						? ( url ) => api.openExternal( { href: url } )
						: null,
			} );
		}

		return Object.freeze( {
			start,
			close,
			callReadOnlyTool,
			openLink,
			updateModelContext,
			requestDisplayMode,
			optionalOpenAI,
			isConnected: () => connected,
			getHostContext: () => ( { ...hostContext } ),
		} );
	}

	scope.AculectWidgetBridge = Object.freeze( { createBridge, PROTOCOL } );
} )( globalThis );

/* Fixture widget: deterministic, read-only Site Information exercise surface. */
( ( scope ) => {
	const document = scope.document;
	const State = scope.AculectWidgetState;
	const bridge = scope.AculectWidgetBridge.createBridge( {
		windowRef: scope,
		appInfo: { name: 'Aculect Widget Fixture', version: '1.0.0' },
		readOnlyTools: [ 'site_get_info' ],
		onEvent: receive,
	} );
	const elements = {
		status: document.getElementById( 'status' ),
		title: document.getElementById( 'title' ),
		url: document.getElementById( 'site-url' ),
		details: document.getElementById( 'details' ),
		refresh: document.getElementById( 'refresh' ),
		open: document.getElementById( 'open-site' ),
		expand: document.getElementById( 'expand' ),
		share: document.getElementById( 'share' ),
		about: document.getElementById( 'about' ),
		dialog: document.getElementById( 'about-dialog' ),
		closeDialog: document.getElementById( 'close-dialog' ),
	};
	let current = State.state( 'loading' );
	let context = {};
	let busy = false;

	function text( value ) {
		return typeof value === 'string' || typeof value === 'number'
			? String( value ).slice( 0, 500 )
			: '';
	}

	function siteUrl() {
		const value = text( current.data?.home_url );
		try {
			const url = new URL( value );
			return url.protocol === 'https:' ? url.href : '';
		} catch {
			return '';
		}
	}

	function render() {
		const complete = current.kind === 'completed';
		document.documentElement.dataset.theme = [ 'light', 'dark' ].includes(
			context.theme
		)
			? context.theme
			: 'auto';
		document.documentElement.dataset.displayMode =
			context.displayMode === 'fullscreen' ? 'fullscreen' : 'inline';
		elements.status.dataset.state = current.kind;
		elements.status.textContent = current.message;
		elements.details.hidden = ! complete;
		elements.title.textContent = complete
			? text( current.data.name ) || 'Connected site'
			: 'Connected site';
		const url = complete ? siteUrl() : '';
		elements.url.textContent = url;
		elements.url.hidden = ! url;
		const fields = {
			wordpress: current.data?.wordpress?.version,
			theme: current.data?.active_theme?.name,
			locale: current.data?.locale,
			timezone: current.data?.timezone,
		};
		for ( const [ key, value ] of Object.entries( fields ) ) {
			document.querySelector( `[data-field="${ key }"]` ).textContent =
				text( value ) || 'Not available';
		}
		elements.refresh.disabled = ! bridge.isConnected() || busy;
		elements.open.hidden = ! url;
		elements.share.hidden = ! complete;
		elements.expand.hidden =
			! context.availableDisplayModes?.includes( 'fullscreen' ) ||
			context.displayMode === 'fullscreen';
	}

	function receive( event ) {
		switch ( event.type ) {
			case 'ready':
			case 'host-context':
				context = { ...context, ...event.context };
				break;
			case 'tool-input':
				current = State.reduce( current, { type: 'loading' } );
				break;
			case 'tool-result':
				current = State.reduce( current, {
					type: 'result',
					result: event.params,
				} );
				break;
			case 'tool-cancelled':
				current = State.reduce( current, { type: 'cancelled' } );
				break;
			case 'closed':
				current = State.reduce( current, { type: 'disabled' } );
				break;
		}
		render();
	}

	async function refresh() {
		busy = true;
		current = State.reduce( current, { type: 'loading' } );
		render();
		try {
			const result = await bridge.callReadOnlyTool( 'site_get_info' );
			current = State.reduce( current, { type: 'result', result } );
		} catch {
			current = State.reduce( current, { type: 'error' } );
		} finally {
			busy = false;
			render();
		}
	}

	elements.refresh.addEventListener( 'click', refresh );
	elements.open.addEventListener( 'click', async () => {
		try {
			await bridge.openLink( siteUrl() );
		} catch {
			current = State.reduce( current, { type: 'error' } );
			render();
		}
	} );
	elements.expand.addEventListener( 'click', async () => {
		try {
			await bridge.requestDisplayMode( 'fullscreen' );
		} catch {
			current = State.reduce( current, { type: 'error' } );
			render();
		}
	} );
	elements.share.addEventListener( 'click', async () => {
		try {
			await bridge.updateModelContext( {
				structuredContent: { site_name: text( current.data?.name ) },
			} );
			elements.status.textContent =
				'Site name shared with the assistant.';
		} catch {
			current = State.reduce( current, { type: 'error' } );
			render();
		}
	} );
	elements.about.addEventListener( 'click', () => {
		elements.dialog.showModal();
		elements.closeDialog.focus();
	} );
	elements.closeDialog.addEventListener( 'click', () =>
		elements.dialog.close()
	);

	// Fixture-only deterministic state mounting for browser and visual regression tests.
	scope.AculectWidgetFixture = Object.freeze( {
		showState( kind, data = null ) {
			current = State.state( kind, data );
			render();
		},
	} );
	render();
	bridge.start().catch( () => {
		current = State.reduce( current, { type: 'disabled' } );
		render();
	} );
} )( globalThis );
</script>
</body>
</html>
